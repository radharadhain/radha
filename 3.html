<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radha Chant Counter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url('https://live.staticflickr.com/65535/53601356381_3baa91be68_b.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
      backdrop-filter: brightness(0.8);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    #counter {
      font-size: 4rem;
      margin-bottom: 40px;
      font-weight: bold;
      color: #FFD700;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      font-size: 1.5rem;
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      background: rgba(255, 215, 0, 0.8);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover:not(:disabled) {
      transform: scale(1.05);
      background: #FFD700;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }

    footer a {
      color: #FFD700;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🪔 Radha Chant Counter 🪔</h1>
  <div id="counter">0</div>

  <div class="buttons">
    <button id="chantBtn">Chant</button>
    <button id="autoChantBtn">Auto Chant</button>
    <button id="resetBtn">Reset</button>
  </div>

  <footer>
    Made with ❤️ for Shri Premanand Maharaj Ji by <a href="https://nirajkanjani.com" target="_blank">Niraj Kanjani</a>
  </footer>

  <audio id="chantAudio" src="chant.mp3" preload="auto"></audio>

  <script>
    const chantBtn = document.getElementById('chantBtn');
    const autoChantBtn = document.getElementById('autoChantBtn');
    const resetBtn = document.getElementById('resetBtn');
    const counterEl = document.getElementById('counter');
    const chantAudio = document.getElementById('chantAudio');

    let count = parseInt(localStorage.getItem('chantCount')) || 0;
    let isAutoChanting = false;
    counterEl.textContent = count;

    let audioUnlocked = false;

    // Unlock audio & play on first click
    async function unlockAndPlay() {
      if (!audioUnlocked) {
        try {
          chantAudio.volume = 0;
          await chantAudio.play();
          chantAudio.pause();
          chantAudio.currentTime = 0;
          chantAudio.volume = 1;
          audioUnlocked = true;
        } catch (err) {
          console.warn('Audio unlock failed:', err);
        }
      }
    }

    chantBtn.addEventListener('click', async () => {
      await unlockAndPlay();
      chantBtn.disabled = true;
      autoChantBtn.disabled = true;
      resetBtn.disabled = true;

      try {
        chantAudio.currentTime = 0;
        await chantAudio.play();
        count++;
        counterEl.textContent = count;
        localStorage.setItem('chantCount', count);
      } catch (err) {
        console.error('Audio play error:', err);
      }

      chantAudio.onended = () => {
        chantBtn.disabled = false;
        autoChantBtn.disabled = false;
        resetBtn.disabled = false;
      };
    });

    autoChantBtn.addEventListener('click', async () => {
      if (isAutoChanting) return;
      await unlockAndPlay();

      let times = prompt("How many times would you like to chant automatically?", "108");
      times = parseInt(times);
      if (isNaN(times) || times <= 0) return;

      isAutoChanting = true;
      chantBtn.disabled = true;
      autoChantBtn.disabled = true;
      resetBtn.textContent = "Stop";

      for (let i = 0; i < times && isAutoChanting; i++) {
        chantAudio.currentTime = 0;
        await chantAudio.play();
        await new Promise(res => chantAudio.onended = res);
        count++;
        counterEl.textContent = count;
        localStorage.setItem('chantCount', count);
      }

      isAutoChanting = false;
      chantBtn.disabled = false;
      autoChantBtn.disabled = false;
      resetBtn.textContent = "Reset";
    });

    resetBtn.addEventListener('click', () => {
      if (isAutoChanting) {
        isAutoChanting = false;
        chantAudio.pause();
        chantAudio.currentTime = 0;
        resetBtn.textContent = "Reset";
        chantBtn.disabled = false;
        autoChantBtn.disabled = false;
        return;
      }
      count = 0;
      counterEl.textContent = count;
      localStorage.setItem('chantCount', count);
    });
  </script>
</body>
</html>
